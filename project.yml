name: MusicPlayer
options:
  bundleIdPrefix: com.personal.musicplayer
  deploymentTarget:
    iOS: "17.0"
packages:
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer.git
    revision: 0947b3e4d755addcea04980fe7cb4a4d92810bf2
  FFmpegKit:
    url: https://github.com/kingslay/FFmpegKit.git
    exactVersion: 6.1.4
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    exactVersion: 1.1.1
targets:
  MusicPlayer:
    type: application
    platform: iOS
    sources:
      - path: MusicPlayer
    dependencies:
      - package: KSPlayer
        product: KSPlayer
      - package: FFmpegKit
        product: Libavformat
      - package: FFmpegKit
        product: Libavcodec
      - package: FFmpegKit
        product: Libavutil
      - package: FFmpegKit
        product: Libswscale
      - package: WhisperKit
        product: WhisperKit
    settings:
      base:
        INFOPLIST_FILE: MusicPlayer/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        PRODUCT_NAME: MuseJRM
        PRODUCT_MODULE_NAME: MusicPlayer
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.musicplayer.offline
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_LANGUAGE: en
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        ENABLE_TESTABILITY: "YES"
    scheme:
      testTargets:
        - MusicPlayerTests
  MusicPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MusicPlayerTests
    dependencies:
      - target: MusicPlayer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MuseJRM.app/MuseJRM"
        BUNDLE_LOADER: "$(TEST_HOST)"
