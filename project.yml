name: MuseJRM
options:
  bundleIdPrefix: com.personal.musicplayer
  deploymentTarget:
    iOS: "17.0"
packages:
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer.git
    revision: 0947b3e4d755addcea04980fe7cb4a4d92810bf2
  FFmpegKit:
    url: https://github.com/kingslay/FFmpegKit.git
    exactVersion: 6.1.4
targets:
  MuseJRM:
    type: application
    platform: iOS
    sources:
      - path: MusicPlayer
    dependencies:
      - package: KSPlayer
        product: KSPlayer
      - package: FFmpegKit
        product: Libavformat
      - package: FFmpegKit
        product: Libavcodec
      - package: FFmpegKit
        product: Libavutil
      - package: FFmpegKit
        product: Libswscale
    settings:
      base:
        INFOPLIST_FILE: MusicPlayer/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        PRODUCT_NAME: MuseJRM
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.musicplayer.offline
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_LANGUAGE: en
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
