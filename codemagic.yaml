workflows:
  ios-unsigned-ipa:
    name: Build MuseJRM IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Archive unsigned iOS app
        script: |
          xcodebuild \
            -project MusicPlayer.xcodeproj \
            -scheme MusicPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive \
            -archivePath build/MusicPlayer.xcarchive
      - name: Package MuseJRM.ipa
        script: |
          mkdir -p artifacts build/Payload
          cp -R build/MusicPlayer.xcarchive/Products/Applications/MuseJRM.app build/Payload/
          codesign --force --deep --sign - --timestamp=none build/Payload/MuseJRM.app
          (cd build && zip -qry ../artifacts/MuseJRM.ipa Payload)
    artifacts:
      - artifacts/MuseJRM.ipa
