name: Build MuseJRM IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run Swift XCTest suite on iOS Simulator
        run: |
          SIM_ID=$(xcrun simctl list devices available iPhone -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; devs=[x['udid'] for k,v in sorted(d.items(), reverse=True) for x in v if x.get('isAvailable') and 'iPhone' in x.get('name','')]; print(devs[0] if devs else '')")
          echo "Using Simulator UDID: $SIM_ID"
          xcodebuild \
            -project MusicPlayer.xcodeproj \
            -scheme MusicPlayer \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test

      - name: Archive unsigned iOS app
        run: |
          xcodebuild \
            -project MusicPlayer.xcodeproj \
            -scheme MusicPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive \
            -archivePath build/MusicPlayer.xcarchive

      - name: Package MuseJRM.ipa
        run: |
          mkdir -p build/Payload
          cp -R build/MusicPlayer.xcarchive/Products/Applications/MuseJRM.app build/Payload/
          codesign --force --deep --sign - --timestamp=none build/Payload/MuseJRM.app
          cd build
          zip -qry MuseJRM.ipa Payload

      - name: Upload MuseJRM.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuseJRM-ipa
          path: build/MuseJRM.ipa
